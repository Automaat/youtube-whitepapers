      - "p.10 Fig. 10: 'two different leaders can be elected for the same term'"

  - id: s041
    speaker: narrator
    scene: joint_consensus
    text: "Dlatego Raft przechodzi przez konfigurację pośrednią. Leader [[cue:joint_entry]]zapisuje w logu wpis C old new, czyli joint consensus, i rozsyła go dalej. Serwer, który ma już ten wpis, przy każdym wyborze i każdym commicie [[cue:both_majorities]]wymaga osobno większości starej i większości nowej konfiguracji, więc nowa konfiguracja nigdy nie decyduje sama. Gdy ten wpis zostanie zatwierdzony, leader dopisuje [[cue:cnew_commit]]samo C new, a po jego zatwierdzeniu stara konfiguracja przestaje mieć znaczenie. Przez cały ten czas klaster obsługuje klientów."
    refs:
      - "p.10 §6: 'In Raft the cluster ﬁrst switches to a transitional conﬁguration we call joint consensus'"
      - "p.11 §6: 'Agreement (for elections and entry commitment) requires separate majorities from both the old and new conﬁgurations.'"
      - "p.11 §6: 'Once a given server adds the new conﬁguration entry to its log, it uses that conﬁguration for all future decisions'"
      - "p.11 §6: 'Cnew cannot make unilateral decisions during this period.'"
      - "p.11 §6: 'the old conﬁguration is irrelevant'"
      - "p.11 §6: 'allows the cluster to continue servicing client requests'"

