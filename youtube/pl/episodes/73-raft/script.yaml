  - id: s038
    speaker: narrator
    scene: fig8_fix
    text: "[[cue:rewind_c]]Wróćmy do stanu, w którym S jeden jest leaderem w termie cztery i ma już u siebie nowy wpis z tego termu pod indeksem trzy. Tym razem przed awarią [[cue:replicate_current]]kopiuje go na S dwa i S trzy. To wpis z bieżącego termu na większości, więc [[cue:commit_both]]jest zatwierdzony, a razem z nim pośrednio indeks dwa. S dwa i S trzy kończą teraz log termem cztery, więc [[cue:s5_blocked]]odmówią głosu S pięć."
