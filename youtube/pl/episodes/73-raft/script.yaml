  - id: s040
    speaker: narrator
    scene: joint_consensus
    text: "Ostatni mechanizm to zmiana składu klastra. Do trzech serwerów [[cue:grow_cluster]]dochodzą S cztery i S pięć, więc stara konfiguracja, C old, ma trzy serwery, a nowa, C new, pięć. Serwery nie przełączą się w tej samej chwili, więc przy [[cue:direct_switch]]bezpośredniej zmianie S jeden i S dwa wybierają S jeden większością starej konfiguracji, a S trzy, S cztery i S pięć wybierają S pięć większością nowej. [[cue:two_leaders]]Mamy dwóch leaderów w jednym termie."
    refs:
