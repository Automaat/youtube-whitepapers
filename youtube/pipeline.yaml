# Defaults for every diagram-first episode; episode.yaml overrides any key.
theme: dark
target_minutes: 12
tts_model: eleven_v4
thumbnail: dog  # dog: youtube/thumbnails/{slug}.png made from the /generate-thumbnails prompt; diagram: rendered card
voices:
  narrator: H5xTcsAIeS5RAykjz57a  # Alex - Professional Narration Polish (Voice Library)
  skeptic: Bz1e1clEKwgN71Vx7cxj   # Asia - Silky Polish Narrator (Voice Library)
elevenlabs:
  bitwarden_item: "ElevenLabs API key (Głęboki Odczyt)"
  credits_per_char: 0.5    # eleven_v4; the run stops before TTS if the plan has fewer left
pipeline:
  gates: [script, video]   # owner sign-off points; remove one to run through it
  review_rounds: 4         # scenario review + fix rounds before stopping
  stills_fix_rounds: 2     # stills review + scene fix rounds before stopping
  stills_per_review: 14    # stills per reviewer agent
